[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artanimate"
version = "1.0.0"
description = "Animate artworks by revealing chromatic color families as sand or waves."
readme = "README_ARTANIMATE.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ArtAnimate contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
dev = ["pytest>=8,<9"]

[project.scripts]
artanimate = "artanimate.cli:main"
artanimate-ui = "artanimate.desktop:main"

[tool.setuptools.packages.find]
include = ["artanimate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
