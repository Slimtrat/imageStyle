[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "artanimate"
version = "2.4.0"
description = "Animate artworks with extensible 2D effects and framed 3D studio videos."
readme = "README_ARTANIMATE.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "ArtAnimate contributors"}]
dependencies = [
  "numpy>=1.26,<3",
  "Pillow>=10,<13",
  "imageio-ffmpeg>=0.5,<1",
]

[project.optional-dependencies]
desktop = ["PySide6>=6.8,<7"]
build = ["PyInstaller>=6.10,<7"]
dev = ["pytest>=8,<9"]

[project.scripts]
artanimate = "artanimate.cli:main"
artanimate-ui = "artanimate.desktop:main"

[tool.setuptools.packages.find]
include = ["artanimate*"]

[tool.setuptools.package-data]
artanimate = ["assets/branding/*.png", "assets/docs/*.json", "assets/qml/*.qml", "assets/materials/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
